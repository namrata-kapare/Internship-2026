 <!-- WAP to calculate electricty bill:
  Unit<=100 2Rs. per unit
  Unit between 101-200 3Rs. per unit
  Unit >200 5Rs. per unit -->

      <!DOCTYPE html>
      <html lang="en">
      <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
      </head>
      <body>
             <script>
                     var unit=Number(prompt("Enter the units:",+unit));
                     var b;
                     if(unit<=200)
                     {
                          if(unit<=100)
                          {
                             b=unit*2;
                           
                          }
                          else
                          {
                             b=unit*3;
                          }
                     }
                     else
                     {
                         b=unit*5;
                     }
                     console.log("Electricity Bill:",+b);
                    
             </script>
      </body>
      </html>


 
    <!-- WAP to print max between 3 numbers
    89 99 78 Max :99   -->

    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
    </head>
    <body>
        <script>
               var a=89;
               var b=99;
               var c=78;
               console.log((a>b&&a>c?a:(b>c?b:c)));
        </script>
    </body>
    </html>
