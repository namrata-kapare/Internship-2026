
<!-- WAP to find greatest no from the three numbers -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var a=15;
        var b=10;
        var c=5;
        if(a>b)
       {
           if(a>c)
           {
                  document.write("The Greatest Number:",+a)
           }
           else
           {
                   document.write("The Greatest Number:",+c)
            }
      }
       else
      {
                   document.write("The Greatest Number:",+b)
      }
    </script>
</body>
</html>
