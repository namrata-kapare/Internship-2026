<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            height: 100px;
            width: 100px;
            border: 1px solid;
             border-radius: 50%;
             margin-left: 600px;
            
        }
    </style>
</head>
<body>

    <div class="box" id="box1" onclick="getOver()" onmouseout="getOut()"></div>
    <div class="box" id="box2"></div>
    <div class="box" id="box3"></div>

    <script>
        let box=document.getElementById('box1')
        box.getOver()
        {
        box.style.backgroundColor="red"
        }
        box.getOut()
        {
            box.style.backgroundColor="none"
        }


        
    </script>

</body>
</html>
