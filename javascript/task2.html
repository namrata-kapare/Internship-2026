    <!-- WAP to print max between 2 number
    56 78 max:78  -->

      <!DOCTYPE html>
      <html lang="en">
      <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
      </head>
      <body>
             <script>
                     var a=56;
                     var b=78;
                     console.log(a>b?a:b);
             </script>
      </body>
      </html>


 
    <!-- WAP to print max between 3 numbers
    89 99 78 Max :99   -->

    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
    </head>
    <body>
        <script>
               var a=89;
               var b=99;
               var c=78;
               console.log((a>b&&a>c?a:(b>c?b:c)));
        </script>
    </body>
    </html>
