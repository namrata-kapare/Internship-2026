<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var mark=Number(prompt("Enter your marks:"));
        if(mark>=90)
        {
             console.log("Grade A");
        }
        else if(mark>=80)
        {
            console.log("Grade B");
        }
        else if(mark>=60)
        {
         
            console.log("Grade C"); 
         }
         else if(mark>=40)
        {
            console.log("Pass");
        }  
    </script>
</body>
</html>
