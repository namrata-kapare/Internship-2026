<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1{
            text-align: center;
        }
        *{
               text-align: center;
        }
        button{
                   height: 40px;
                   width:150px;
                   border:none;
                   border-radius:20px;
                   background-color: aquamarine;
                   color:black;
        }
    </style>
</head>
<body>
    <h1>Text Converter</h1>
    <textarea name="" id="content" rows="15" column="60"></textarea>
    <br><br>
    <button onclick="convertUppercase()">convert_To_Upercase</button>
    <button onclick="conertLowercase()">convert_To_Lowercase</button>
    <button>count_words</button>

    <script>
        let text=document.getElementById("content")
        function convertUppercase()
        {
            text.value=text.value.toUpperCase();
        }
        function convertLowercase()
        {
            text.value=text.value.toLowerCase();
        }
        function countWords()
        {
            let cleantext=text.value.split(" ");
            text.value=`counting of words: ${cleantext.length}`
            console.log(cleantext);
        }
    </script>
    
</body>
</html>
