<body>
    <script>
        var a=Number(prompt("Enter the number:"))
        if(a!=0)
        {
            if(a>0)
            {
                 console.log("Positive Number")
            }
            else
           {
                 console.log("Negative Number")
            }
         }
        else
        {
                 console.log("ZERO....!!!!!")
        }
    </script>
