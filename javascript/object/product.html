<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #container{
            display:flex;
            justify-content:space-around;
        }
        #c{
            height: 500px;
            width: 300px;
            border: 1px solid;
        }
    </style>
</head>
<body>
    <h1>product list</h1>
    <button onclick="getProduct()">show products</button>
    <div id="container"></div>

    <script>
        let card=document.getElementById("container");

        let products=[{
    pname:"watch",

    image:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS1jbUe42ajyH6lbfLwdJMX0J70DTUd6G1OzEC5M_wHLQ&s=10"
},{

    price:40000 ,

},{
     pname:"pjone",
    cname:"samsung",
    price:34000,

},{
     pname:"headphones",

}]

function getProduct(){

         products.forEach((val)=>{



            card.innerHTML+=`<div id="c"><img src =${val.img} alt="">
                            <h2>product name:${val.pname}</h2>
                             <h3>company name:${val.cname}</h3>
                              <h4>price:${val.price}</h4></div>`

         })
}

    </script>
</body>
</html>
