<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 1.block 2.inline 3.inline-block -->
     <!-- 1 -which acquires entire browser width
      modification are possible -->
      <h1 style="background-color: rgb(204, 255, 0);height:200px; width:300px;">This is a heading</h1>
      <h2 style="background-color: rgb(204, 255, 0);height:200px; width:300px;">This is a heading</h2>
      <!-- inline-which acquires content width
       modifications are not possible -->
       <i style="background-color: rgb(255, 68, 0); height: 200px; width: 300px;">italic text</i>
       <b style="background-color: rgb(255, 68, 0); height: 200px; width: 300px;">bold text</b>
       <!-- inline-block - modification are possible / content width acquired -->
        
</body>
</html>
