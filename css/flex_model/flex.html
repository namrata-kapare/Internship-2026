<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .parent
        {
            height: 600px;
            width:600px;
            background-color: yellow;
            display:flex;
            justify-content: center;      
            justify-content: space-around;
            align-items: center;
        }
        .child
        {
            height:200px;
            width:100px;
            background-color: red;
            border: 1px solid;
            display: inline-block;
            margin: 10px;
        }
        #child3
        {
          background-color: aqua;
          align-self: end;
        }
    </style>
</head>
<body>
    
     <!-- display:flex - sub property
     x-axis -justify content
     y-axis-align item  -->

     <!-- div.parent>div.child#child$*4  shortcut for the div creation -->
      <div class="parent">
        <div class="child" id="child1"></div>
        <div class="child" id="child2"></div>
        <div class="child" id="child3"></div>
        <div class="child" id="child4"></div>
      </div>

</body>
</html>
