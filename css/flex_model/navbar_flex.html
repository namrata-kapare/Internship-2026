<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        
        *{
            margin: 0;
            padding: 0;
            color: white;
        }
        body{
            height: 2000px;
            display: flex;
            justify-content: center;
            margin-top: 30px;
            background-image: linear-gradient(white,pink,purple,red,black);
        }
        nav{
            height: 120px;
            width: 70%;
            background-color: black;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 20px;
            position: fixed;
        }
        h1{
            margin-left: 30px;
        }
        ul{
            width: 400px;
            display: flex;
            list-style: none;
            justify-content: space-around;
        }
        a{
            text-decoration: none;
        }
    </style>
</head>
<body>
    
    <nav>
        <h1>Linkcode</h1>
        <ul>
            <!-- li*3>a  -shortcut for following tags -->
            <li><a href="">Home</a></li>
            <li><a href="">Services</a></li>
            <li><a href="">Contact</a></li>

        </ul>
    </nav>
</body>
</html>
