<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        
            div{
                height: 200px;
                width: 200px;
                /* border: 2px solid black; */
                /* border-width: 2px;                                //For the border design we can use these three properties
                border-style: dashed;
                border-color: rgb(255, 68, 0); */
                background-color: purple;
                border : 5px solid rgb(0, 0, 0);                    /*also we can implement three in one line in this way */

                border-right: 5px dotted rgb(0, 123, 255);
                border-bottom: 3px solid rgb(255, 0, 0);
                border-left: 5px double rgb(0, 255, 0); 
                border-radius: 20px; /* to make the border round */
                /* border-top-left-radius: 20px; /* 
                border-top-right-radius: 40px; 
                border-bottom-right-radius: 50px;
                border-bottom-left-radius: 60px; */
                border-radius: 20px 40px 50px 60px; /* top right bottom left for whole border-radius */
                box-shadow: 2px 2px 5px rgb(0, 0, 0); /* to create shadow for the box */
            }
        
    </style>
</head>
<body>
    <div></div>
</body>
</html>
