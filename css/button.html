<head>

    <title>Document</title>
    <style>
        input{
              width: 200px;
              border:none;
              border-bottom: 2px solid rgb(0, 0, 0);
              outline: none; /* to remove the outline of the box */

            height: 60px;

    <br><br>
    <button>Request OTP</button>
