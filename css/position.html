

<!-- position - elements

1.static - we cannot change place
2.relative - chnages the place reference
             original position remains vacant
3.absolute - changes the place but the refernce of its parent originsl position takes another element
4.fixed - 
5.sticky -              -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            height: 200px;
            width: 100px;
            border: 1px solid;
            display: inline-block;
        }
        #box1
        {
            background-color: purple;
            position: relative;
            top: 200px;
            right: 50px;
        }
        #box2
        {
            background-color: aqua;
            position: absolute;
            top: 300px;
            right: 300px;
        
        }
        #box3
        {
            background-color: brown;
            position: fixed;
        }
        #box4
        {
            background-color: chartreuse;
            position: sticky;
        }
    </style>
</head>
<body>
    
    <div class="box" id="box1"></div>
    <div class="box" id="box2"></div>
    <div class="box" id="box3"></div>
    <div class="box" id="box4"></div>

</body>
</html>
